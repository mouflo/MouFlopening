<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MouFlopening</title>
<link rel="icon" type="image/svg+xml" href="/icons/mouflopening.svg"><link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="manifest" href="/icons/manifest.webmanifest"><meta name="theme-color" content="#121315">
<link rel="stylesheet" href="/ui/mou-ui.css?v={{ version|urlencode }}">
<script src="/ui/mou-ui.js?v={{ version|urlencode }}" defer></script>
<style>
    body { padding:16px; }
    .container { max-width:1200px; margin:0 auto; }
    button, select, input[type=text] { font:inherit; }
    .btn { padding:9px 16px; border:0; border-radius:4px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
    .btn:hover { background:var(--accent-hover); }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    .btn.ghost { background:var(--field); color:var(--text); font-weight:500; }
    .btn.ghost:hover { background:#383838; }
    .btn.small { padding:6px 12px; font-size:.85rem; }
    .btn.danger { background:var(--err); }
    .panel { background:var(--card); border-radius:8px; padding:16px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:16px; }
    .stat { background:var(--card); border-radius:8px; padding:10px 16px; font-size:.9rem; color:var(--muted); }
    .stat b { color:var(--text); font-size:1.1rem; margin-right:4px; }
    .progress { flex:1; min-width:220px; background:var(--field); border-radius:6px; height:34px; position:relative; overflow:hidden; display:none; }
    .progress.show { display:block; }
    .progress .bar { background:var(--accent); height:100%; width:0; transition:width .4s; }
    .progress .txt { position:absolute; inset:0; display:flex; align-items:center; padding:0 12px; font-size:.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .layout > * { min-width:0; }
    .layout { display:grid; grid-template-columns:minmax(260px,380px) 1fr; gap:16px; align-items:start; }
    @media (max-width:800px) {
        body { padding:10px; }
        .layout { grid-template-columns:minmax(0,1fr); }        /* minmax(0,…) : un contenu large ne fait plus déborder la page */
        .toolbar { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .toolbar .stat { padding:8px 12px; }
        .toolbar .btn, .toolbar .check, .progress { grid-column:1 / -1; }
        .toolbar .btn { padding:12px 16px; }
        .list { max-height:55vh; }
        .filters { flex-wrap:wrap; }
        .filters select { flex:1 1 100%; }
        input[type=text], select { font-size:16px; }      /* évite le zoom automatique sur iPhone */
        .search-row { flex-direction:column; }
        .search-row input { min-width:0; width:100%; }
        .search-row .btn { width:100%; padding:12px; }
        .theme { display:grid; grid-template-columns:auto 1fr; gap:8px 10px; }
        .theme audio { grid-column:1 / -1; grid-row:2; width:100%; max-width:100%; min-width:0; }
        .theme .btn { justify-self:end; padding:10px 16px; }
        .cand h4 small { display:block; margin:2px 0 0; }
        .chip { padding:9px 14px; }
        .row { padding:12px; }
    }
    .filters { display:flex; gap:8px; margin-bottom:10px; }
    .filters input, .filters select, .search-row input { background:var(--field); color:var(--text); border:1px solid var(--line); border-radius:4px; padding:9px 10px; outline:none; }
    .filters input { flex:1; min-width:0; }
    .filters input:focus, .search-row input:focus { border-color:var(--accent); }
    .list { max-height:70vh; overflow-y:auto; }
    .row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:4px; cursor:pointer; border:1px solid transparent; }
    .row:hover { background:var(--field); }
    .row.active { background:#24331f; border-color:var(--accent); }
    .row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .pill { font-size:.72rem; padding:2px 8px; border-radius:10px; background:var(--field); color:var(--muted); white-space:nowrap; }
    .pill.ok { background:rgba(82,181,75,.18); color:#9bdc95; }
    .steps { padding:14px 4px; font-size:.9rem; min-height:60vh; }
    .stp { padding:3px 0; color:var(--muted); }
    .stp.cur { color:var(--text, #fff); font-weight:600; }
    .stp small { color:var(--muted); font-weight:400; margin-left:6px; }
    .spin { display:inline-block; width:12px; height:12px; margin-right:8px; border:2px solid var(--muted); border-top-color:var(--accent); border-radius:50%; animation:mfspin .8s linear infinite; vertical-align:-1px; }
    @keyframes mfspin { to { transform:rotate(360deg); } }
    .empty { color:var(--muted); padding:30px 10px; text-align:center; }
    .detail h2 { margin:0 0 4px; font-size:1.2rem; }
    .detail .path { color:var(--muted); font-size:.8rem; margin-bottom:14px; word-break:break-all; }
    .search-row { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
    .search-row input { flex:1; min-width:180px; }
    .current { background:var(--field); border-radius:6px; padding:10px 12px; margin-bottom:12px; font-size:.9rem; }
    .current audio { width:100%; margin-top:6px; }
    .cand { background:var(--field); border-radius:6px; padding:12px; margin-bottom:12px; }
    .cand h4 { margin:0 0 8px; font-size:1rem; font-weight:600; }
    .cand h4 small { color:var(--muted); font-weight:400; margin-left:6px; }
    .theme { display:flex; align-items:center; gap:10px; padding:6px 0; border-top:1px solid var(--line); flex-wrap:wrap; }
    .theme .slug { width:48px; font-weight:600; color:var(--accent); }
    .theme audio { flex:1; min-width:180px; height:36px; }
    .check { color:var(--muted); font-size:.9rem; display:flex; align-items:center; gap:6px; cursor:pointer; }
    .check input { width:17px; height:17px; accent-color:var(--accent); }
    .targets { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
    .tabs { display:flex; gap:6px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; }
    .tab { padding:9px 18px; border-radius:6px; background:var(--card); border:1px solid var(--line); color:var(--text); cursor:pointer; font-size:.95rem; white-space:nowrap; }
    .tab.active { border-color:var(--accent); background:#24331f; font-weight:600; }
    .tab.bad { opacity:.5; }
    .ytplay { width:100%; max-width:420px; aspect-ratio:16/9; border:0; border-radius:4px; background:#000; }
    .chip { padding:6px 12px; border-radius:16px; background:var(--field); border:1px solid transparent; color:var(--text); cursor:pointer; font-size:.85rem; }
    .chip:hover { background:#383838; }
    .chip.active { border-color:var(--accent); background:#24331f; }
    .chip .tick { color:var(--accent); margin-left:4px; }
    .note { padding:10px 12px; border-radius:4px; font-size:.9rem; margin:10px 0; }
    .note.ok { background:rgba(82,181,75,.15); border:1px solid var(--accent); color:#c9efc5; }
    .note.err { background:rgba(229,83,75,.15); border:1px solid var(--err); color:#ffb4ae; }
    .note.warn { background:rgba(229,168,75,.15); border:1px solid var(--warn); color:#f3d9a8; }
    .list.collapsed { max-height:none; }
    .list.collapsed .row:not(.active) { display:none; }
    .list.collapsed .row.active::after { content:"▾ changer"; color:var(--muted); font-size:.8rem; white-space:nowrap; }
    .cands.collapsed .cand:not(.chosen) { display:none; }
    .cands.collapsed .cand.chosen { border:1px solid var(--accent); cursor:pointer; }
    .cands.collapsed .cand.chosen h4::after { content:"  ▾ changer"; color:var(--muted); font-size:.8rem; font-weight:400; }
    .hint { color:var(--muted); font-size:.85rem; margin:0 0 10px; }
    .livelog { margin-bottom:16px; padding:8px 14px 10px; position:sticky; top:0; z-index:5; box-shadow:0 6px 14px rgba(0,0,0,.45); }
    .livehead { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:.85rem; margin-bottom:6px; }
    .livewin { height:7.8em; overflow-y:auto; font:12px/1.55 ui-monospace,Menlo,Consolas,monospace; color:#9a9a9a; scroll-behavior:smooth; }
    .livewin.big { height:60vh; }
    .livewin div { white-space:pre-wrap; word-break:break-word; }
    .livewin div:last-child { color:#fff; font-weight:600; }
    .batchlog summary { cursor:pointer; color:var(--muted); font-size:.9rem; }
    .batchlog pre { margin:10px 0 0; white-space:pre-wrap; word-break:break-word; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace; color:#d6d6d6; max-height:40vh; overflow:auto; }
        .opt { display:flex; align-items:center; gap:8px; margin:8px 0 0; font-size:.9em; color:var(--muted,#aaa); cursor:pointer; }
        .opt input { width:auto; margin:0; }
</style>
</head>
<body>
<div class="container">
    <div id="mou-header" data-app="mouflopening" data-prefix="MouFl" data-rest="opening" data-version="{{ version }}" data-settings="1"
         data-sub="Thèmes musicaux pour ta médiathèque Emby · chaque thème est normalisé à {{ target_db }} dB"></div>

    <div class="tabs" id="tabs"></div>

    <div class="toolbar">
        <div class="stat"><b id="nTotal">–</b><span id="lblItems">séries</span></div>
        <div class="stat"><b id="nWith">–</b>avec thème</div>
        <div class="stat"><b id="nWithout">–</b>sans thème</div>
        <div class="stat" id="statSkipped" style="display:none"><b id="nSkipped">–</b>mis de côté</div>
        <div class="stat" id="statSeasons"><b id="nSeasons">–</b>saisons sans thème</div>
        <label class="check"><input type="checkbox" id="batchSeasons" checked> avec les saisons</label>
        <button class="btn" id="batchStart">⚡ Télécharger tous les thèmes manquants</button>
        <button class="btn ghost" id="dupStart">🔎 Doublons de saisons</button>
        <button class="btn ghost" id="normStart">🔊 Normaliser les thèmes existants</button>
        <button class="btn danger" id="batchStop" style="display:none">■ Arrêter</button>
        <div class="progress" id="progress"><div class="bar" id="bar"></div><div class="txt" id="progTxt"></div></div>
    </div>
    <div class="panel livelog" id="batchLogBox" style="display:none">
        <div class="livehead"><span id="liveTitle">Dernier traitement</span><span><button type="button" class="btn ghost small" id="liveMore">Tout voir</button> <button type="button" class="btn ghost small" id="liveClose" style="display:none" title="Fermer ce résultat">✕ Fermer</button></span></div>
        <div class="livewin" id="batchLogTxt"></div>
    </div>
    <div class="panel" id="dupBox" style="display:none;margin-bottom:16px"></div>
    <div id="globalNote"></div>

    <div class="layout">
        <div class="panel">
            <div class="filters">
                <input type="text" id="filterText" placeholder="Filtrer…" autocomplete="off">
                <select id="filterState">
                    <option value="missing">Sans thème</option>
                </select>
            </div>
            <div class="list" id="list"><div class="empty">Chargement…</div></div>
        </div>

        <div class="panel detail" id="detail">
            <div class="empty">Choisis un titre dans la liste.</div>
        </div>
    </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let items = [], cats = [], curCat = 0, selected = null, emby = false, listCollapsed = false;
try { curCat = parseInt(localStorage.getItem('mf_cat') || '0') || 0; } catch (e) {}
const catKind = () => (cats[curCat] || {}).kind || 'anime';
const sourceName = () => catKind() === 'anime' ? 'AnimeThemes' : 'YouTube';
const catItems = () => items.filter(i => i.cat === curCat);

async function api(url, opts) {
    const res = await fetch(url, opts);
    if (res.status === 401) { window.location.href = '/login'; throw new Error('Session expirée'); }
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok && !data.error) data.error = 'Erreur ' + res.status;
    return data;
}
const post = (url, body) => api(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
// Opération longue suivie en direct : le serveur annonce chaque étape, on l'affiche au fur et à mesure
let currentJob = null;      // opération en cours (pour pouvoir l'arrêter, ex. « Mettre de côté »)
async function runJob(url, body, onSteps) {
    const start = await post(url, body);
    if (start.error) return start;
    const mine = {id: start.job, stop: false}; if (url.includes('search')) currentJob = mine;   // seule une recherche s'arrête (pas un téléchargement)
    const steps = []; let since = 0, fails = 0;
    for (;;) {
        await new Promise(r => setTimeout(r, 400));
        if (mine.stop) return {cancelled: true};
        let st;
        try { st = await api('/api/job/' + start.job + '?since=' + since); } catch (e) { st = {error: String(e)}; }
        if (st.error) { if (++fails > 15) return {error: st.error}; continue; }
        fails = 0; since = st.next;
        steps.push(...st.steps);
        onSteps(steps, st.elapsed, st.done);
        if (st.done) { if (currentJob === mine) currentJob = null; return (st.result && st.result[0]) || {error: 'Réponse vide'}; }
    }
}
function stopCurrentJob() {
    if (!currentJob) return;
    currentJob.stop = true; const id = currentJob.id; currentJob = null;
    api('/api/job/' + id + '/cancel', {method: 'POST'}).catch(() => {});
}
// Sur téléphone la progression est sous l'écran : on la place à environ un tiers de la hauteur, et on la suit si elle redescend
function ensureVisible(el) {
    const e = el.getBoundingClientRect();
    if (e.top < 70 || e.top > window.innerHeight * 0.6)
        window.scrollTo({top: Math.max(0, window.scrollY + e.top - window.innerHeight * 0.3), behavior: 'smooth'});
}
function stepsHtml(steps, elapsed, done) {
    const past = steps.slice(0, -1).map(s => `<div class="stp done">✓ ${esc(s.text)}</div>`).join('');
    const last = steps[steps.length - 1];
    const cur = done ? '' : `<div class="stp cur"><span class="spin"></span>${esc(last ? last.text : 'Démarrage…')} <small>${Math.floor(elapsed)} s</small></div>`;
    return past + (done && last ? `<div class="stp done">✓ ${esc(last.text)}</div>` : cur);
}
function note(el, text, kind) { el.innerHTML = text ? `<div class="note ${kind || 'ok'}">${esc(text)}</div>` : ''; }

// ---------- liste ----------
async function loadLibrary(keepSelection) {
    const data = await api('/api/library');
    items = data.items || [];
    emby = data.emby;
    cats = data.categories || [];
    if (curCat >= cats.length) curCat = 0;
    renderTabs();
    if (!cats.length) note($('globalNote'), 'Aucune médiathèque trouvée : vérifie « library » dans config.json (bouton Journal pour le détail).', 'warn');
    else if (cats.some(c => !c.ok)) note($('globalNote'), 'Un dossier de médiathèque est introuvable : partage réseau non monté ? (détails : bouton Journal)', 'warn');
    else if (!emby) note($('globalNote'), 'Emby n\'est pas encore configuré (clé API manquante) : les thèmes sont enregistrés, mais Emby ne sera pas prévenu.', 'warn');
    else note($('globalNote'), '');
    const mine = catItems(), movie = catKind() === 'movie';
    const w = mine.filter(i => i.has_theme).length;
    $('lblItems').textContent = movie ? 'films' : catKind() === 'anime' ? 'animes' : 'séries';
    fillFilter();
    $('statSeasons').style.display = movie ? 'none' : ''; $('dupStart').style.display = movie ? 'none' : ''; $('batchSeasons').parentElement.style.display = movie ? 'none' : '';
    const sk = mine.filter(i => i.skipped).length;
    $('nTotal').textContent = mine.length; $('nWith').textContent = w; $('nWithout').textContent = mine.length - w - sk;
    $('nSkipped').textContent = sk; $('statSkipped').style.display = sk ? '' : 'none';
    $('nSeasons').textContent = mine.reduce((n, i) => n + (i.seasons || []).filter(x => !x.has_theme && !x.skipped && x.number > 0).length, 0);
    renderList();
    if (keepSelection && selected) {
        const cur = items.find(i => i.id === selected.id);
        if (cur) { selected = cur; target = targetsOf(cur).find(t => t.id === (target && target.id)) || targetsOf(cur)[0]; if ($('targets')) { renderTargets(); refreshCurrent(); refreshSkip(); } }
    }
}

// Les choix du filtre dépendent de l'onglet : pas de « saison » pour un film
function fillFilter() {
    const kind = catKind(), sel = $('filterState'), before = sel.value;
    const word = kind === 'movie' ? 'Film' : kind === 'anime' ? 'Anime' : 'Série';
    const opts = [['missing', word + ' sans thème']];
    if (kind !== 'movie') opts.push(['seasons', 'Saison sans thème']);
    opts.push(['skipped', 'Recherché sans résultat'], ['all', kind === 'movie' ? 'Tous' : 'Toutes'], ['done', 'Avec thème']);
    sel.innerHTML = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('');
    sel.value = opts.some(o => o[0] === before) ? before : 'missing';
}

function renderTabs() {
    $('tabs').style.display = cats.length > 1 ? '' : 'none';
    $('tabs').innerHTML = cats.map(c => `<button type="button" class="tab${c.index === curCat ? ' active' : ''}${c.ok ? '' : ' bad'}" data-i="${c.index}">${c.kind === 'movie' ? '🎬' : c.kind === 'anime' ? '🎌' : '📺'} ${esc(c.name)}</button>`).join('');
    document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => switchCat(parseInt(t.dataset.i))));
}
function switchCat(i) {
    if (i === curCat) return;
    curCat = i; try { localStorage.setItem('mf_cat', String(i)); } catch (e) {}
    selected = null; target = null; listCollapsed = false;
    $('detail').innerHTML = '<div class="empty">Choisis un titre dans la liste.</div>';
    $('filterText').value = '';
    loadLibrary();
}

function renderList() {
    const q = $('filterText').value.trim().toLowerCase(), st = $('filterState').value;
    const keep = i => st === 'all' ? true : st === 'done' ? i.has_theme : st === 'skipped' ? (i.skipped || (i.seasons || []).some(x => x.skipped)) : st === 'seasons' ? (i.seasons || []).some(x => !x.has_theme && !x.skipped && x.number > 0) : (!i.has_theme && !i.skipped);
    const rows = catItems().filter(i => keep(i) && (!q || i.name.toLowerCase().includes(q)));
    $('list').classList.toggle('collapsed', listCollapsed && !!selected && rows.some(i => i.id === selected.id));
    $('list').innerHTML = rows.length ? rows.map(i =>
        `<div class="row${selected && selected.id === i.id ? ' active' : ''}" data-id="${esc(i.id)}">
            <div class="name">${esc(i.title || i.name)}</div>
            ${(cats[curCat] || {}).multi ? `<span class="pill">${esc(i.origin)}</span>` : ''}
            ${(i.seasons || []).length ? `<span class="pill">${i.seasons.filter(x => x.has_theme).length}/${i.seasons.length} saisons</span>` : ''}
            <span class="pill${i.has_theme ? ' ok' : ''}">${i.has_theme ? '🎵 thème' : i.skipped ? 'rien trouvé' : 'sans thème'}</span></div>`).join('')
        : '<div class="empty">Aucun titre dans cette médiathèque.</div>';
    document.querySelectorAll('.row').forEach(r => r.addEventListener('click', () => {
        if (listCollapsed && selected && r.dataset.id === selected.id) { listCollapsed = false; renderList(); }   // clic sur la série choisie : on rouvre la liste
        else select(r.dataset.id);
    }));
}

// ---------- détail ----------
let target = null;   // ce qu'on traite : la série elle-même ou l'une de ses saisons
function targetsOf(item) {
    return [{id: item.id, label: catKind() === 'movie' ? 'Film' : 'Série', number: null, has_theme: item.has_theme, skipped: item.skipped}].concat((item.seasons || []).map(x =>
        ({id: x.id, label: x.number === 0 ? 'Spéciaux (S0)' : 'Saison ' + x.number, number: x.number, has_theme: x.has_theme, skipped: x.skipped})));
}
let origOn = true;
try { origOn = localStorage.getItem('mf_orig') !== '0'; } catch (x) {}

function defaultQuery() {
    const base = selected.title || selected.name;
    return target && target.number > 1 ? base + ' Season ' + target.number : base;
}

function select(id) {
    selected = items.find(i => i.id === id); if (!selected) return;
    target = targetsOf(selected)[0];
    listCollapsed = true;                 // la liste se referme sur la série choisie (comme MouFloster)
    renderList(); renderDetail();
    if (window.innerWidth <= 800) $('detail').scrollIntoView({behavior: 'smooth', block: 'start'});
}

function renderDetail() {
    $('detail').innerHTML = `
        <h2>${esc(selected.title || selected.name)}</h2>
        <div class="path">${esc(selected.name)}</div>
        <div class="targets" id="targets"></div>
        <div id="current"></div>
        <div class="hint" id="hint"></div>
        <div class="search-row">
            <input type="text" id="q" value="${esc(defaultQuery())}" autocomplete="off">
            <button class="btn" id="btnSearch">🔍 Chercher</button>
        </div>
        <div id="skipRow"></div>
        <label class="opt"><input type="checkbox" id="optOrig" ${origOn ? 'checked' : ''}> Chercher aussi sous le titre original (d'après Emby)</label>
        <div id="msg"></div>
        <div id="cands"></div>`;
    renderTargets(); refreshCurrent();
    $('btnSearch').addEventListener('click', () => search(true));
    refreshSkip();
    $('optOrig').addEventListener('change', e => { origOn = e.target.checked; try { localStorage.setItem('mf_orig', origOn ? '1' : '0'); } catch (x) {} });
    $('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(true); });
    if (!target.has_theme && !target.skipped) search();
}

function renderTargets() {
    const list = targetsOf(selected);
    $('targets').style.display = list.length > 1 ? '' : 'none';
    $('targets').innerHTML = list.map(t => `<button type="button" class="chip${t.id === target.id ? ' active' : ''}" data-id="${esc(t.id)}">${esc(t.label)}${t.has_theme ? '<span class="tick">🎵</span>' : ''}</button>`).join('');
    document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => switchTarget(c.dataset.id)));
}

function switchTarget(id) {
    target = targetsOf(selected).find(t => t.id === id) || target;
    $('q').value = defaultQuery(); $('cands').innerHTML = ''; $('cands').className = 'cands'; note($('msg'), '');
    renderTargets(); refreshCurrent(); refreshSkip();
    if (!target.has_theme && !target.skipped) search();
}

// Mettre de côté : le titre quitte la liste « sans thème » (utile quand la recherche ne donne rien) ; on peut le remettre
function refreshSkip() {
    const row = $('skipRow'); if (!row) return;
    if (target.has_theme) { row.innerHTML = ''; return; }
    row.innerHTML = target.skipped
        ? `<div class="hint">Mis de côté (recherche sans résultat) : il n'apparaît plus dans « sans thème ». <button class="btn ghost small" id="btnSkip">↩ Remettre dans la liste</button></div>`
        : `<div class="hint"><button class="btn ghost small" id="btnSkip">⏭ Mettre de côté</button> pour ne plus le voir dans « sans thème »</div>`;
    $('btnSkip').addEventListener('click', async () => {
        const want = !target.skipped;
        if (want && currentJob) { stopCurrentJob(); $('cands').innerHTML = ''; note($('msg'), ''); }   // recherche en cours : on l'arrête tout de suite
        const r = await post('/api/skip', {id: target.id, skip: want});
        if (r.error) return note($('msg'), r.error, 'err');
        await loadLibrary(true); refreshSkip();
    });
}

// Suppression d'un thème : deux validations successives (le fichier est mis de côté, pas détruit)
function deleteStep(step) {
    const row = $('delRow'); if (!row) return;
    const name = esc(selected.title || selected.name) + ' · ' + esc(target.label);
    if (step === 1) {
        row.innerHTML = `<div class="note warn">Supprimer le thème de « ${name} » ?<br>
            <button class="btn ghost small" id="delNo">Annuler</button> <button class="btn danger small" id="delGo">Continuer</button></div>`;
        $('delGo').addEventListener('click', () => deleteStep(2));
    } else if (step === 2) {
        row.innerHTML = `<div class="note err"><b>Dernière validation</b> : le thème de « ${name} » sera retiré. Le fichier est gardé dans le dossier des anciens thèmes.<br>
            <button class="btn ghost small" id="delNo">Annuler</button> <button class="btn danger small" id="delGo">Oui, supprimer ce thème</button></div>`;
        $('delGo').addEventListener('click', async () => {
            $('delGo').disabled = true;
            const r = await post('/api/theme/delete', {id: target.id, confirm: 2});
            if (r.error) { row.innerHTML = ''; return note($('msg'), r.error, 'err'); }
            note($('msg'), r.message, r.message.includes('Emby actualise') ? 'ok' : 'warn');
            await loadLibrary(true);
        });
    }
    $('delNo').addEventListener('click', () => { row.innerHTML = '<button class="btn danger small" id="btnDel">🗑 Supprimer ce thème</button>'; $('btnDel').addEventListener('click', () => deleteStep(1)); });
}

function refreshCurrent() {
    if (!selected || !$('current')) return;
    $('hint').textContent = target.number === 0 ? 'Emby associe un thème à un dossier, pas à un fichier : ce thème sera lu pour tous les épisodes et films du dossier Spéciaux. Le mode automatique ne traite pas les Spéciaux : choisis-le ici.' : '';
    $('current').innerHTML = target.has_theme
        ? `<div class="current">Thème actuel · ${esc(target.label)}<audio controls preload="none" src="/api/theme?id=${encodeURIComponent(target.id)}&t=${Date.now()}"></audio>
           <div id="delRow"><button class="btn danger small" id="btnDel">🗑 Supprimer ce thème</button></div></div>` : '';
    if (target.has_theme) $('btnDel').addEventListener('click', () => deleteStep(1));
}

const blockedVideos = new Set();     // vidéos de ThemerrDB que YouTube refuse de télécharger : on les écarte des propositions
async function search(full) {
    const title = $('q').value.trim(); if (!title) return;
    $('cands').innerHTML = `<div class="steps"><div class="stp cur"><span class="spin"></span>Démarrage de la recherche…</div></div>`; note($('msg'), ''); ensureVisible($('cands'));
    const data = await runJob('/api/search', {title, cat: curCat, id: target.id, original: origOn, full: full === true, exclude: [...blockedVideos]},
        (steps, el, done) => { $('cands').innerHTML = `<div class="steps">${stepsHtml(steps, el, done)}</div>`; if (!done) ensureVisible($('cands')); });
    if (data.cancelled) return;
    if (data.error) { $('cands').innerHTML = ''; return note($('msg'), data.error, 'err'); }
    const res = data.results || [];
    if (!res.length) {
        $('cands').innerHTML = '';
        note($('msg'), (data.note ? data.note + '. ' : '') + 'Aucun résultat : mis de côté (filtre « Recherché sans résultat »). Tu peux essayer un autre titre puis relancer la recherche.', 'warn');
        if (data.skipped) { await loadLibrary(true); refreshSkip(); }
        return;
    }
    $('cands').className = 'cands';
    if ((data.queries || []).length > 1) note($('msg'), 'Recherché sous : ' + data.queries.join(' · '), 'ok');
    else if (data.themerr_only) {
        $('msg').innerHTML = `<div class="note ok">★ Thème validé par la communauté (ThemerrDB) : pas de recherche YouTube. <button class="btn ghost small" id="btnMore">Chercher aussi sur YouTube</button></div>`;
        $('btnMore').addEventListener('click', () => search(true));
    }
    else if (data.note) note($('msg'), data.note, 'warn');
    $('cands').innerHTML = res.map((a, ai) => `
        <div class="cand" data-ai="${ai}"><h4>${esc(a.name)}<small>${esc(a.channel ? a.channel + ' · ' : '')}${esc(a.year || '')} · correspondance ${esc(a.score)} %</small></h4>
        ${a.themes.map((t, ti) => `
            <div class="theme"><span class="slug">${esc(t.slug)}</span>
            ${t.youtube ? `<button class="btn ghost small ytbtn" data-yt="${esc(t.youtube)}">▶ Écouter</button>` : `<audio controls preload="none" src="${esc(t.audio || t.video)}"></audio>`}
            <button class="btn small" data-a="${ai}" data-t="${ti}">Utiliser</button></div>`).join('')}
        </div>`).join('');
    // Une seule écoute à la fois : lancer un thème arrête (et ferme) celui qui jouait
    function stopPlayers(except) {
        document.querySelectorAll('#cands iframe.ytplay').forEach(f => {
            if (f === except) return;
            const btn = document.createElement('button');
            btn.className = 'btn ghost small ytbtn'; btn.dataset.yt = f.dataset.yt; btn.textContent = '▶ Écouter';
            btn.addEventListener('click', () => startYt(btn));
            f.replaceWith(btn);
        });
        document.querySelectorAll('#cands audio').forEach(a => { if (a !== except) a.pause(); });
    }
    function startYt(b) {
        stopPlayers(null);
        const f = document.createElement('iframe');
        f.className = 'ytplay'; f.dataset.yt = b.dataset.yt;
        f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(b.dataset.yt) + '?autoplay=1';
        f.referrerPolicy = 'strict-origin-when-cross-origin'; f.allow = 'autoplay; encrypted-media'; f.allowFullscreen = true;
        b.replaceWith(f);
    }
    document.querySelectorAll('#cands .ytbtn').forEach(b => b.addEventListener('click', () => startYt(b)));
    document.querySelectorAll('#cands audio').forEach(a => a.addEventListener('play', () => stopPlayers(a)));
    document.querySelectorAll('#cands button[data-a]').forEach(b => b.addEventListener('click', async () => {
        const t = res[b.dataset.a].themes[b.dataset.t];
        b.disabled = true; b.textContent = '…';
        document.querySelectorAll('#cands button[data-a]').forEach(x => x.disabled = true);
        const r = await runJob('/api/save', {id: target.id, url: t.url || t.audio || t.video, title: selected.title, trusted: String(res[b.dataset.a].name).startsWith('★')},
            (steps, el, done) => { $('msg').innerHTML = `<div class="note ok"><div class="steps" style="padding:0">${stepsHtml(steps, el, done)}</div></div>`; if (!done) ensureVisible($('msg')); });
        document.querySelectorAll('#cands button[data-a]').forEach(x => x.disabled = false);
        b.textContent = 'Utiliser';
        note($('msg'), r.message || r.error, r.error ? 'err' : (r.emby_ok ? 'ok' : 'warn'));
        if (r.error && t.youtube && String(res[b.dataset.a].name).startsWith('★')) {
            // le thème de la communauté ne peut pas être téléchargé : on bascule tout de suite sur la recherche YouTube
            blockedVideos.add(t.youtube);
            await search(true);
            note($('msg'), r.error + ' Voici d\'autres propositions sur YouTube.', 'warn');
            return;
        }
        if (!r.error) {
            document.querySelectorAll('.cand').forEach(c => c.classList.toggle('chosen', c.dataset.ai === b.dataset.a));
            $('cands').classList.add('collapsed');
            loadLibrary(true);
        }
    }));
    document.querySelectorAll('.cand').forEach(c => c.addEventListener('click', e => {
        if ($('cands').classList.contains('collapsed') && c.classList.contains('chosen') && !e.target.closest('audio,button')) $('cands').classList.remove('collapsed');
    }));
}

// ---------- lot automatique ----------
let pollTimer = null;
async function pollBatch() {
    const s = await api('/api/batch/status');
    const n = s.done + s.failed;
    const sig = s.total + ':' + s.done + ':' + s.failed + ':' + (s.messages || []).length;     // identifie le dernier traitement terminé
    let closed = false; try { closed = !s.running && localStorage.getItem('batchClosed') === sig; } catch (e) {}
    s.lastSig = sig;
    $('liveClose').style.display = s.running ? 'none' : ''; window.lastBatchSig = sig;
    $('progress').classList.toggle('show', !closed && (s.running || s.total > 0));
    $('bar').style.width = (s.total ? Math.round(100 * n / s.total) : 0) + '%';
    const norm = s.kind === 'normalize';
    $('progTxt').textContent = s.running ? `${norm ? '🔊 ' : ''}${n}/${s.total} · ${s.current || ''}` : (s.total ? (norm ? `Terminé : ${s.done} thème(s) vérifié(s), ${s.failed} en erreur` : `Terminé : ${s.done} ajouté(s), ${s.failed} introuvable(s)`) : '');
    $('batchStart').style.display = s.running ? 'none' : ''; $('normStart').style.display = s.running ? 'none' : ''; $('batchStop').style.display = s.running ? '' : 'none';
    const msgs = (s.messages || []).concat(s.running && s.current ? ['⏳ ' + s.current + '…'] : []), win = $('batchLogTxt');
    $('batchLogBox').style.display = msgs.length && !closed ? '' : 'none';
    $('liveTitle').textContent = s.running ? (norm ? 'Normalisation en cours…' : 'Téléchargement en cours…') : 'Dernier traitement';
    if (win.dataset.n !== msgs.join('|').length + ':' + msgs.length) {     // on ne redessine que s'il y a du nouveau ; on suit la dernière ligne sauf si on a remonté la fenêtre à la main
        const atEnd = win.scrollHeight - win.scrollTop - win.clientHeight < 40;
        win.innerHTML = msgs.map(m => `<div>${esc(m)}</div>`).join(''); win.dataset.n = msgs.join('|').length + ':' + msgs.length;
        if (atEnd || !win.dataset.seen) { win.scrollTop = win.scrollHeight; win.dataset.seen = '1'; }
    }
    if (s.running) { clearTimeout(pollTimer); pollTimer = setTimeout(pollBatch, 2000); loadLibrary(true); }
    else if (pollTimer) { pollTimer = null; loadLibrary(true); }
}
$('batchStart').addEventListener('click', async () => {
    const withSeasons = $('batchSeasons').checked && catKind() !== 'movie';
    const anime = catKind() === 'anime';
    if (!confirm(anime ? 'Chercher et télécharger automatiquement les thèmes manquants de « ' + ((cats[curCat] || {}).name || '') + ' » sur AnimeThemes (' + (withSeasons ? 'séries et saisons' : 'séries seulement') + ') ?'
        : 'Télécharger les thèmes manquants de « ' + ((cats[curCat] || {}).name || '') + ' » ?\n\nSeuls les thèmes validés par la communauté (ThemerrDB) sont pris. Les autres titres sont ignorés : tu les cherches à la main.')) return;
    const r = await post('/api/batch/start', {seasons: withSeasons, cat: curCat}); if (r.error) note($('globalNote'), r.error, 'err'); pollBatch();
});
$('normStart').addEventListener('click', async () => {
    if (!confirm('Ramener tous les thèmes MP3 déjà présents au même niveau ? Les originaux sont conservés (dossier data/themes-backup sur le serveur). Les thèmes déjà au bon niveau ne sont pas touchés.')) return;
    const r = await post('/api/normalize/start', {}); if (r.error) note($('globalNote'), r.error, 'err'); pollBatch();
});
$('liveClose').addEventListener('click', () => {      // traitement terminé : on retire le résultat (barre verte + fenêtre), il ne reviendra pas au rechargement
    try { localStorage.setItem('batchClosed', window.lastBatchSig); } catch (e) {}
    $('batchLogBox').style.display = 'none'; $('progress').classList.remove('show');
});
$('liveMore').addEventListener('click', () => {
    const w = $('batchLogTxt'), big = w.classList.toggle('big');
    $('liveMore').textContent = big ? 'Réduire' : 'Tout voir'; w.scrollTop = w.scrollHeight;
});
$('batchStop').addEventListener('click', async () => { await post('/api/batch/stop'); });

$('filterText').addEventListener('input', () => { listCollapsed = false; renderList(); });
$('filterState').addEventListener('change', () => { listCollapsed = false; renderList(); });
loadLibrary().then(pollBatch);

// ---------- doublons de saisons ----------
$('dupStart').addEventListener('click', async () => {
    const box = $('dupBox'); box.style.display = ''; box.innerHTML = '<div class="stp cur"><span class="spin"></span>Comparaison des thèmes des séries et de leurs saisons…</div>';
    const r = await api('/api/duplicates');
    if (r.error) { box.innerHTML = `<div class="note err">${esc(r.error)}</div>`; return; }
    if (!r.seasons) { box.innerHTML = '<div class="note ok">✅ Aucun doublon : aucune saison n\'a le même thème que la série ou qu\'une autre saison.</div><div style="margin-top:8px"><button class="btn ghost small" id="dupClose">Fermer</button></div>'; $('dupClose').onclick = () => box.style.display = 'none'; return; }
    box.innerHTML = `<div style="margin-bottom:8px"><b>${r.seasons} saison(s)</b> ont exactement le même thème que ${''}la série ou qu'une autre saison (AnimeThemes n'a probablement pas de fiche propre à ces saisons). Décoche celles que tu veux garder.</div>
        <div style="max-height:45vh;overflow-y:auto">${r.series.map(x => `<div style="padding:6px 0;border-bottom:1px solid var(--line)"><b>${esc(x.series)}</b> <small style="color:var(--muted)">(thème de ${x.keep === 'série' ? 'la série' : 'la saison ' + esc(x.keep)} gardé)</small><br>${x.dups.map(d => `<label class="check" style="margin:4px 0"><input type="checkbox" class="dupck" value="${esc(d.id)}" checked> Saison ${d.number} : même thème</label>`).join('')}</div>`).join('')}</div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="dupFix">Remettre les saisons cochées dans « sans thème »</button><button class="btn ghost" id="dupClose">Fermer</button></div>
        <div class="hint" style="margin-top:6px">Rien n'est supprimé : les fichiers vont dans le dossier des anciens thèmes. Ensuite tu choisis à la main (avec écoute) le bon thème de chaque saison.</div><div id="dupMsg"></div>`;
    $('dupClose').onclick = () => box.style.display = 'none';
    $('dupFix').onclick = async () => {
        const ids = [...document.querySelectorAll('.dupck:checked')].map(c => c.value);
        if (!ids.length || !confirm(ids.length + ' saison(s) vont être remises dans « sans thème » (les fichiers sont mis de côté, pas supprimés). Continuer ?')) return;
        const f = await post('/api/duplicates/fix', {ids}); note($('dupMsg'), f.error || `${f.count} saison(s) remise(s) dans « sans thème ».`, f.error ? 'err' : 'ok');
        if (!f.error) { await loadLibrary(true); $('dupFix').style.display = 'none'; }
    };
});
